<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>stage</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Playpen+Sans+Hebrew:wght@300&family=Heebo:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Two homes, two couches: the seller's on the right, the buyer's on the
     left. Whoever is acting has the big phone; the other waits, small and
     dimmed, on their own couch. The phones themselves are laid over this
     by ffmpeg — the boxes below only mark where they go. */
  :root{--ink:#1B1815;--paper:#FCFBF7;--cream:#F2EBD9;--line:#D8D2C4;--orange:#EE5A2A;--butter:#FBE3A4;
    --body:'Amatic SC','Heebo',sans-serif;--hand:'Playpen Sans Hebrew','Heebo',sans-serif}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
  .stage{position:relative;width:1080px;height:1920px}
  .home{position:absolute;bottom:0;top:0}
  .couch{position:absolute;bottom:130px;left:50%;transform:translateX(-50%)}
  .name{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-family:var(--hand);font-weight:300;line-height:1.3}
  .name b{display:block;font-family:var(--body);font-weight:700}
  .big .name{font-size:34px}.big .name b{font-size:56px}
  .small .name{font-size:26px;opacity:.6}.small .name b{font-size:40px}
  /* a gentle divider between the two homes */
  .wall{position:absolute;top:320px;bottom:40px;width:2px;background:var(--line)}
</style>
<div class="stage" id="stage"></div>
<script>
  // a couch in the app's line style: seat, back, two arms, cushions
  const couch = (w, fill) => `<svg class="couch" width="${w}" height="${w * .48}" viewBox="0 0 200 96" fill="none" stroke="#1B1815" stroke-width="3" stroke-linejoin="round">
    <rect x="30" y="12" width="140" height="40" rx="10" fill="${fill}"/>
    <rect x="10" y="40" width="180" height="36" rx="10" fill="${fill}"/>
    <rect x="4" y="36" width="24" height="44" rx="10" fill="${fill}"/><rect x="172" y="36" width="24" height="44" rx="10" fill="${fill}"/>
    <path d="M30 76v12M170 76v12"/><path d="M100 14v38" opacity=".5"/></svg>`;
  // layout: the big phone is 700×1400 at y=330; the small one 300×600, bottom at the same line
  window.setup = (active) => {
    const seller = active === "seller";
    const big = { left: seller ? 340 : 40, w: 700 }, small = { left: seller ? 40 : 740, w: 300 };
    const home = (cls, x, w, name, sub, fill) =>
      `<div class="home ${cls}" style="left:${x}px;width:${w}px">${couch(cls === "big" ? 760 : 330, fill)}<div class="name"><b>${name}</b>${sub}</div></div>`;
    document.getElementById("stage").innerHTML =
      home(seller ? "big" : "small", seller ? big.left - 30 : small.left - 15, seller ? big.w + 60 : small.w + 30, "לני", "על הספה בסלון", "#FBE3A4")
      + home(seller ? "small" : "big", seller ? small.left - 15 : big.left - 30, seller ? small.w + 30 : big.w + 60, "דנה", "בבית אחר, על ספה אחרת", "#DCEBF6")
      + `<div class="wall" style="left:${seller ? 355 : 725}px"></div>`;
  };
</script>
</html>
