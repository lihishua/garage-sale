<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>chat</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* a messaging app as everyone knows it — green bar, beige wallpaper, two
     kinds of bubble — drawn from scratch: no logo, no lifted artwork */
  html,body{margin:0;width:780px;height:1560px;overflow:hidden;font-family:'Heebo',system-ui,sans-serif;background:#EFEAE2;color:#111}
  .top{height:200px;background:#075E54;color:#fff;display:flex;align-items:flex-end;padding:0 28px 22px;box-sizing:border-box;gap:22px}
  .top .back{font-size:44px;opacity:.9}
  .ava{width:88px;height:88px;border-radius:50%;background:#DDE6D5;display:grid;place-items:center;font-size:44px}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:40px;font-weight:500;line-height:1.2}
  .who span{display:block;font-size:28px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wall{position:absolute;top:200px;bottom:150px;left:0;right:0;padding:26px 24px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;
    background-image:radial-gradient(circle at 20px 20px,rgba(0,0,0,.04) 3px,transparent 3px);background-size:60px 60px}
  .msg{max-width:78%;padding:16px 22px 12px;border-radius:22px;font-size:33px;line-height:1.4;position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word;opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s}
  .msg.on{opacity:1;transform:none}
  .in{align-self:flex-start;background:#fff;border-top-right-radius:6px}
  .out{align-self:flex-end;background:#D9FDD3;border-top-left-radius:6px}
  .msg .name{display:block;font-size:27px;font-weight:500;color:#C2185B;margin-bottom:2px}
  .msg .name.b{color:#1565C0}
  .msg .t{display:block;text-align:left;font-size:24px;color:#667;margin-top:6px;direction:ltr}
  .msg a{color:#027EB5;text-decoration:underline;direction:ltr;unicode-bidi:embed}
  .bar{position:absolute;bottom:0;left:0;right:0;height:150px;background:#F0F0F0;display:flex;align-items:center;gap:16px;padding:0 22px;box-sizing:border-box}
  .box{flex:1;min-height:84px;max-height:300px;background:#fff;border-radius:42px;padding:18px 30px;box-sizing:border-box;font-size:32px;line-height:1.35;color:#111;white-space:pre-wrap;overflow:hidden}
  .box:empty::before{content:"הודעה";color:#999}
  .send{width:88px;height:88px;border-radius:50%;background:#00A884;display:grid;place-items:center;flex:none;transition:transform .12s}
  .send.tap{transform:scale(.85)}
  .send svg{width:40px;height:40px;fill:#fff;transform:scaleX(-1)}
  .caret{display:inline-block;width:3px;height:36px;background:#111;vertical-align:-6px;animation:blink 1s steps(1) infinite;margin-inline-start:2px}
  @keyframes blink{50%{opacity:0}}
</style>
<div class="top"><span class="back">‹</span><div class="ava" id="ava"></div><div class="who"><b id="who"></b><span id="sub"></span></div></div>
<div class="wall" id="wall"></div>
<div class="bar"><div class="box" id="box"></div><div class="send" id="send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div></div>
<script>
  const el = (id) => document.getElementById(id);
  const now = () => { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const linkify = (s) => s.replace(/(https?:\/\/\S+)/g, '<a>$1</a>');
  window.setup = ({ who, sub, ava }) => { el("who").textContent = who; el("sub").textContent = sub ?? ""; el("ava").textContent = ava ?? ""; };
  window.bubble = ({ from, text, out, ticks, blue }) => {
    const m = document.createElement("div");
    m.className = "msg " + (out ? "out" : "in");
    m.innerHTML = (from ? `<span class="name${blue ? " b" : ""}">${from}</span>` : "") + linkify(text)
      + `<span class="t">${now()}${out ? (ticks ? " ✓✓" : " ✓") : ""}</span>`;
    el("wall").appendChild(m);
    requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add("on")));
  };
  // the composer fills like a paste, then a tap on send makes it a bubble
  window.type = async (text, ms = 900) => {
    const box = el("box"); const n = text.length; const t0 = performance.now();
    await new Promise((done) => { const step = () => { const k = Math.min(n, Math.round(n * (performance.now() - t0) / ms));
      box.innerHTML = text.slice(0, k) + '<span class="caret"></span>'; if (k < n) requestAnimationFrame(step); else done(); }; step(); });
  };
  window.send = async () => {
    const text = el("box").textContent; el("send").classList.add("tap");
    await new Promise((r) => setTimeout(r, 130)); el("send").classList.remove("tap"); el("box").innerHTML = "";
    window.bubble({ text, out: true, ticks: false });
  };
  window.ticks = () => { const t = document.querySelector(".out:last-child .t"); if (t) t.textContent = t.textContent.replace(" ✓", " ✓✓"); };
</script>
</html>
